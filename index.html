<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astronomy Picture of the Day</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">Astronomy Picture of the Day</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <button id="viewAPOD" class="btn btn-link nav-link active">View APOD</button>
                </li>
                <li class="nav-item">
                    <button id="viewFavorites" class="btn btn-link nav-link">Favorites</button>
                </li>
            </ul>
        </div>
    </nav>

    <div id="apodSection" class="container mt-5">
        <h1 class="text-center">Astronomy Picture of the Day</h1>
        <form id="dateForm" class="text-center my-4">
            <input type="date" id="dateInput" class="form-control w-50 mx-auto" required>
            <button type="submit" class="btn btn-primary mt-3">Get Picture</button>
        </form>
        <div id="apodContainer" class="text-center mt-5"></div>
    </div>

    <div id="favoritesSection" class="container mt-5" style="display: none;">
        <h1 class="text-center">Favorite Images</h1>
        <div id="favouritesContainer" class="row mt-4"></div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
